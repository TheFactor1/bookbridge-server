# Bootstrap: run this FIRST to get the setup wizard, then open the browser.
#
#   docker compose -f docker-compose.setup.yml up -d
#   open http://<this machine>:8090
#
# The wizard writes .env and brings up docker-compose.yml for you.
#
# The stack directory is mounted at the SAME absolute path inside the
# container as on the host (${PWD}:${PWD}) so that any relative bind path in
# docker-compose.yml (e.g. the default ./calibre-library) resolves to the
# same real directory whether the compose command runs on the host or from
# inside this container against the shared Docker socket.
name: shelfmark
services:
  setup:
    build: ./setup
    image: ghcr.io/thefactor1/shelfmark-setup:latest
    container_name: shelfmark-setup
    restart: unless-stopped
    ports:
      - "8090:8090"
    environment:
      - STACK_DIR=${PWD}
      - SETUP_PORT=8090
      - HOST_ADDRESS=${HOST_ADDRESS:-}
    volumes:
      # The Docker socket is root on the host. This container is meant to run
      # only during setup and be stopped afterwards. A socket proxy limiting
      # it to the compose calls it makes is the next hardening step.
      - /var/run/docker.sock:/var/run/docker.sock
      - ${PWD}:${PWD}
